services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:4001:4001"

  # Upstream Apollo MCP Server: NO published port. Reachable only from the proxy on the compose network.
  mcp:
    image: ghcr.io/apollographql/apollo-mcp-server:v2.1.0
    depends_on:
      - api
    volumes:
      - ./mcp-config.yaml:/config.yaml:ro
      - ./graphql:/data:ro
    command: ["/config.yaml"]

  # The only MCP entry point: bearer-token + Origin checks, then forwards to mcp.
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    depends_on:
      - mcp
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN (see README)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:6274,http://127.0.0.1:6274}
      UPSTREAM_URL: http://mcp:8000
    ports:
      - "127.0.0.1:8000:8000"
