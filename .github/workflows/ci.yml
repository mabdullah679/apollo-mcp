name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  stack-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm ci
      - name: Generate a random per-run MCP token
        run: |
          t=$(openssl rand -hex 32)
          echo "::add-mask::$t"
          echo "MCP_AUTH_TOKEN=$t" >> "$GITHUB_ENV"
      - run: docker compose up --build -d
      - run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null -X POST http://127.0.0.1:8000/mcp && break
            sleep 2
          done
      - run: npm test
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
